name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  checks:
    permissions:
      contents: read
    uses: luxass/shared-workflows/.github/workflows/reusable-ci.yaml@7be4a924607be148a2093d4651d920cfcc9a264f # v0.13.0
    with:
      node-version: "26"
      fmt: true
      fmt-script: "format:check"

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create GitHub release
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --generate-notes
          build/github-notifications-darwin-arm64
          build/github-notifications-linux-x64
          build/github-notifications-win-x64.exe
        env:
          GH_TOKEN: ${{ github.token }}
