server:
  host: 127.0.0.1
  port: 3001
  schedule: "0 * * * * *"

github:
  tokenEnv: GITHUB_TOKEN
  maxPages: 10

rules:
  - name: workflow-failures
    when: |
      notification.reason == "ci_activity" and (
        notification.title contains "run failed" or notification.title contains "Run failed"
      )
    actions:
      - type: done

  - name: release-subscriptions
    when: notification.type == "Release" and notification.reason == "subscribed"
    actions:
      - type: done

  - name: closed-or-merged
    when: subject.merged == true or subject.state == "closed"
    actions:
      - type: done

  - name: noisy-bots
    when: |
      subject.author == "renovate[bot]" or subject.author == "dependabot[bot]" or
        subject.author == "coderabbitai[bot]" or subject.author == "vercel[bot]" or
        subject.author == "cloudflare-workers-and-pages[bot]" or subject.author == "github-actions[bot]"
    actions:
      - type: done

  - name: stale-review-requests
    when: notification.reason == "review_requested" and subject.reviewPending == false
    actions:
      - type: done
